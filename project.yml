name: HomeInventory
options:
  minimumXcodeGenVersion: 2.45.0
  bundleIdPrefix: app.homeinventory
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
packages:
  UltralyticsYOLO:
    url: https://github.com/ultralytics/yolo-ios-app.git
    from: 8.9.4
targets:
  HomeInventory:
    type: application
    platform: iOS
    sources:
      # Includes Inventory/MLModels (MobileCLIP-S2 encoders), which is gitignored
      # and populated by scripts/fetch-mobileclip.sh before generating the project.
      - path: Inventory
    dependencies:
      - package: UltralyticsYOLO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.homeinventory.catalog
        PRODUCT_NAME: HomeInventory
        INFOPLIST_FILE: Inventory/Support/Info.plist
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: NO
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
